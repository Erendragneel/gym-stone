<svg xmlns="http://www.w3.org/2000/svg" width="600" height="484" viewBox="0 0 600 484" role="img" aria-labelledby="guide-title guide-description">
<title id="guide-title">Kettlebell Russian Twist: female position guide</title>
<desc id="guide-description">Three static three-quarter-view positions of a seated kettlebell Russian twist: center, turned left, and turned right. The buttocks rest on the mat in every panel, the bent knees are higher than the hips, and the heels rest forward on the same floor baseline. The torso reclines slightly. Both hands hold the horns of one kettlebell close to the chest while the ribs and shoulders turn; the seated hips and legs remain still.</desc>
