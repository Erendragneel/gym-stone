<svg xmlns="http://www.w3.org/2000/svg" width="600" height="484" viewBox="0 0 600 484" role="img" aria-labelledby="guide-title guide-description">
<title id="guide-title">Kettlebell Sit-Up: female position guide</title>
<desc id="guide-description">Three static side-view positions of a bent-knee kettlebell sit-up: torso lowered, midway up, and seated. The person holds one kettlebell by its horns in both hands against the chest at every position. The knees remain bent and the feet stay on the mat. The bell is never pressed overhead.</desc>
