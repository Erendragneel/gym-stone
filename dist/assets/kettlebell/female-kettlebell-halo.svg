<svg xmlns="http://www.w3.org/2000/svg" width="600" height="484" viewBox="0 0 600 484" role="img" aria-labelledby="guide-title guide-description">
<title id="guide-title">Kettlebell Halo: female position guide</title>
<desc id="guide-description">Three static positions of a standing kettlebell halo: bell in front of the chest, bell passing close beside the head, and a rear view showing the bell behind the head. Both hands hold the handle throughout. Continue around the opposite side back to the front, then reverse the direction. The head, ribs, hips, and feet remain still.</desc>
