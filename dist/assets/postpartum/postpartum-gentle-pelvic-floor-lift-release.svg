<svg xmlns="http://www.w3.org/2000/svg" width="600" height="484" viewBox="0 0 600 484" role="img" aria-labelledby="guide-title guide-description">
<title id="guide-title">Gentle Pelvic Floor Lift and Release: Position guide</title>
<desc id="guide-description">Static position guide: a supported seated person beside abstract lift and release reminders. No internal anatomy is represented; individual clinical instruction is needed.</desc>
<rect width="600" height="484" rx="24" fill="#f7f5ed"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="33" fill="#398278" font-size="13" font-weight="700" letter-spacing="2">POSTPARTUM</text>
<text x="570" y="33" fill="#398278" font-size="12" font-weight="700" text-anchor="end" letter-spacing="1">CLINICIAN GUIDED</text>
<text x="30" y="72" fill="#164b49" font-size="25" font-weight="700" >Gentle Pelvic Floor</text><text x="30" y="103" fill="#164b49" font-size="25" font-weight="700" >Lift and Release</text>
<rect x="28" y="122" width="544" height="255" rx="20" fill="#fff"/>
<text x="47" y="148" fill="#577973" font-size="11" font-weight="700" letter-spacing="1.5">POSITION GUIDE</text>

  <path d="M115 266 V330 H240 M130 330 V354 M224 330 V354" fill="none" stroke="#91b7af" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="170" cy="190" r="24" fill="#f0ceaf" stroke="#164b49" stroke-width="5"/>
  <path d="M165 222 L160 283 L218 290 L227 342 L255 342" fill="none" stroke="#164b49" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M155 283 L176 300 L183 345 L208 345" fill="none" stroke="#164b49" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M163 232 L143 278 L188 286 M179 234 L201 278 L219 287" fill="none" stroke="#338c7f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
<rect x="325" y="174" width="210" height="50" rx="25" fill="#dcefe5"/><text x="430" y="206" fill="#236e63" font-size="16" font-weight="700" text-anchor="middle">LIFT  /  RELEASE</text><text x="323" y="265" fill="#164b49" font-size="20" font-weight="600" >Gentle effort.</text><text x="323" y="294" fill="#164b49" font-size="20" font-weight="600" >Full relaxation.</text><text x="323" y="323" fill="#164b49" font-size="20" font-weight="600" >No straining.</text>
<text x="300" y="414" fill="#164b49" font-size="20" font-weight="600" text-anchor="middle">Breathe normally. Fully release.</text><text x="300" y="442" fill="#164b49" font-size="20" font-weight="600" text-anchor="middle">Only when recommended for you.</text>
<text x="300" y="472" fill="#577973" font-size="12" font-weight="500" text-anchor="middle">Static illustration - follow your own recovery advice.</text>
</g>
