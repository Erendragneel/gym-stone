<svg xmlns="http://www.w3.org/2000/svg" width="600" height="484" viewBox="0 0 600 484" role="img" aria-labelledby="guide-title guide-description">
<title id="guide-title">Comfortable Rib Breathing: Position guide</title>
<desc id="guide-description">Static position guide: a person sits supported with hands near the lower ribs. Symbols suggest gentle breath, not a prescribed breathing rate.</desc>
<rect width="600" height="484" rx="24" fill="#f7f5ed"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="33" fill="#398278" font-size="13" font-weight="700" letter-spacing="2">POSTPARTUM</text>
<text x="570" y="33" fill="#398278" font-size="12" font-weight="700" text-anchor="end" letter-spacing="1">GENTLE STARTS</text>
<text x="30" y="78" fill="#164b49" font-size="25" font-weight="700" >Comfortable Rib Breathing</text>
<rect x="28" y="122" width="544" height="255" rx="20" fill="#fff"/>
<text x="47" y="148" fill="#577973" font-size="11" font-weight="700" letter-spacing="1.5">POSITION GUIDE</text>

  <path d="M115 266 V330 H240 M130 330 V354 M224 330 V354" fill="none" stroke="#91b7af" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="170" cy="190" r="24" fill="#f0ceaf" stroke="#164b49" stroke-width="5"/>
  <path d="M165 222 L160 283 L218 290 L227 342 L255 342" fill="none" stroke="#164b49" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M155 283 L176 300 L183 345 L208 345" fill="none" stroke="#164b49" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M164 229 L135 253 L166 265 M177 227 L199 250 L175 267" fill="none" stroke="#338c7f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
<path d="M125 242 Q105 254 125 268 M211 242 Q231 254 211 268" fill="none" stroke="#38a995" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M112 239 L125 242 L118 254 M218 254 L211 242 L225 239" fill="none" stroke="#38a995" stroke-width="4"/><text x="323" y="231" fill="#164b49" font-size="20" font-weight="600" >Let the ribs</text><text x="323" y="260" fill="#164b49" font-size="20" font-weight="600" >widen gently.</text><text x="323" y="289" fill="#164b49" font-size="20" font-weight="600" >Relax shoulders.</text>
<text x="300" y="414" fill="#164b49" font-size="20" font-weight="600" text-anchor="middle">Easy breath in. Unforced breath out.</text><text x="300" y="442" fill="#164b49" font-size="20" font-weight="600" text-anchor="middle">No breath holds.</text>
<text x="300" y="472" fill="#577973" font-size="12" font-weight="500" text-anchor="middle">Static illustration - follow your own recovery advice.</text>
</g>
</svg>
