name: Publish Gym Stone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify every reviewed animation
        run: node scripts/verify-motion-package.cjs .
      - uses: actions/configure-pages@v5
      - name: Assemble reviewed static app
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -a dist _site/dist
          touch _site/.nojekyll
          test "$(du -sb _site | cut -f1)" -lt 1000000000
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          (async () => {
            const url = `https://api.github.com/repos/${process.env.GH_REPOSITORY}/actions/runs/${process.env.GH_RUN_ID}/artifacts`;
            for (let attempt = 0; attempt < 12; attempt++) {
              const response = await fetch(url, {headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
              }});
              if (!response.ok) throw new Error(`Artifact lookup returned HTTP ${response.status}`);
              const data = await response.json();
              if (data.artifacts.some(artifact => artifact.name === 'github-pages' && !artifact.expired)) {
                console.log('Pages artifact is available for deployment.');
                return;
              }
              console.log('Waiting for the Pages artifact to become visible.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('The uploaded Pages artifact is still unavailable after one minute.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - id: deployment
        uses: actions/deploy-pages@v4
